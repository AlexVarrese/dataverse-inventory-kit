# Copie para a pasta do cliente como inventory.yaml e ajuste.
# Caminhos relativos são resolvidos a partir da pasta deste arquivo.

environment:
  name: CLIENTE-PRD                       # aparece nas notas, tags e Bases (use um por ambiente)
  url: https://contoso.crm.dynamics.com   # ou DATAVERSE_URL no .env

auth:
  # auto = spn (se CLIENT_ID/CLIENT_SECRET no .env) → mcp (cache do `dataverse auth create`) → azcli → devicecode
  # spn  = Service Principal (Application User)       — ver INSTALL.md §3A
  # mcp  = mesmo login do servidor MCP do Dataverse    — ver INSTALL.md §3B
  method: auto
  env_file: .env                          # TENANT_ID, CLIENT_ID, CLIENT_SECRET (nunca versionar)
  # devicecode_cache: false               # true = guarda o token do device code no cofre CRIPTOGRAFADO do
                                          # sistema (DPAPI/Keychain/libsecret); nunca em texto puro

# padrao | metadata_only — metadata_only trava em desligado tudo que lê conteúdo ou registros
# (webresource_content, flow/process_definitions, plugin_binaries, field_usage, storage, plugin_trace,
# extras de dados), mesmo que o núcleo ou um extra peça. record_counts (contagem agregada) continua permitido.
profile: padrao

scope:
  # O que é "componente do cliente". Qualquer critério que bater inclui o componente.
  prefixes: [contoso_]                    # prefixo(s) do publisher; padrão de nome lógico
  # keywords: [contoso]                   # default = prefixos sem "_" (casa nomes de processos/assemblies)
  solutions: []                           # uniquenames de soluções a inventariar integralmente
  include_unmanaged: true                 # tudo que é não gerenciado (customização direta no ambiente)
  exclude_prefixes: []                    # ex. [cc_] — bibliotecas de terceiros que entram por "não gerenciado"
  exclude_microsoft: true                 # descarta msdyn_, mscrm_, adx_… (publishers da Microsoft), mesmo dentro
                                          # das soluções do escopo; ribbons de tabelas da Microsoft não são lidos
                                          # (veja "De onde veio o escopo" em 01 Ambiente após a 1ª extração)
  all: false                              # true = tudo da org (gera MUITO volume; use com cuidado)

# O núcleo sempre roda: tudo o que foi customizado (com código, definições, privilégios, ribbons, catálogo de 100%,
# dependências) e se está em uso (contagem de registros, preenchimento dos campos). Extras = diagnóstico, opt-in:
#   saude (plugin trace) · armazenamento · historico (importações de soluções) · camadas (camadas de solução)
#   binarios (DLLs de plugin) · usuarios (lista nominal — DADO PESSOAL, só com autorização do cliente)
extras: []                                # ex. [historico, saude]; `--extras` no comando vale mais

plugin_trace_days: 7
parallel: 4                               # chamadas simultâneas nas etapas de uma chamada por item

field_usage:
  tables: []                      # vazio = todas as tabelas do escopo; ex.: [account, contact, contoso_project]
  max_records: 500000             # acima disso a contagem por paginação vira "parcial"

# Clones locais dos repositórios de código do cliente (opcional). Nada é clonado nem alterado:
# só leitura de arquivos + `git rev-parse`/`git log -1`.
repos: []
#  - path: ../repos/WebResources
#    kind: webresources            # webresources | plugins | any
#  - path: ../repos/Plugins
#    kind: plugins

# Extração por partes (ambiente muito grande ou rede lenta). Equivalem a --only e --completar no comando:
# collectors: [webresources, forms]   # roda só estas etapas (+ as que elas exigem)
# completar: 20261014T120424Z        # herda as demais etapas deste snapshot (run_id, pasta ou "ultimo");
#                                    # sem `collectors`, refaz só o que falhou/faltou nele. Ver `dvinv snapshots`.
#                                    # Remova a linha depois: com ela, toda extração vira complemento.

output:
  raw_dir: out/CLIENTE-PRD/_raw           # raiz dos snapshots: <raw_dir>/<run_id>/*.json + manifest.json
  # derived_dir: out/CLIENTE-PRD/_derived # achados/dependências por snapshot (padrão: irmão de raw_dir)
  vault_root: ./vault                     # raiz do vault Obsidian (pode ser um vault já existente)
  vault_folder: Dataverse/CLIENTE-PRD     # pasta dentro do vault
  # Vault publicado como repositório de conhecimento (um por unidade de negócio; vários ambientes dentro):
  # vault_root: ../<programa>-<unidade>-knowledge   # a pasta do repositório (clone do remoto)
  # repo: true          # README/.gitignore/.gitattributes com bloco dvinv + resumo do `git status` no fim do render

# Ajuste fino (avançado) — normalmente não precisa. Padrões em scripts/dvinv/config.py (DEEP_DEFAULTS).
# deep:
#   webresource_content_types: [1, 3]   # 1 HTML, 3 JS (padrão); 2 CSS, 4 XML, 9 XSL, 11 SVG, 12 RESX
#   webresource_skip_names: []          # [] desliga o filtro de bibliotecas de terceiros pelo nome
#   webresource_max_bytes: 1000000      # acima disso: segredos verificados, conteúdo não guardado
#   catalog_max_rows_per_type: 200000   # teto de linhas lidas por tipo no catálogo
#   platform_dependencies_columns: false  # dependências por coluna custom (1 chamada por coluna — pesado)
#   solution_layers_max: 500            # teto de tabelas no extra camadas
#   batch_size: 20                      # leituras por pacote $batch (ribbons, privilégios, colunas…); 0 = sem $batch
